[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",
    "UP007",  # X | Y union syntax not available in MicroPython
    "UP006",  # use lowercase generics: not available in MicroPython
    "UP035",  # deprecated imports: MicroPython stdlib differs
]
